<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230f1115'/><rect x='6' y='13' width='20' height='6' rx='3' fill='%2335c07a'/></svg>">
<title>TokenBar</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --raised: #1d212a; --line: #262b36;
    --text: #e7ebf2; --muted: #8b93a4; --accent: #4f8cff;
    --ok: #35c07a; --warn: #e2b447; --err: #e5604d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  /* Author `display` rules below outrank the UA stylesheet's [hidden] rule,
     so state the intent explicitly or the gate and app render together. */
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    letter-spacing: 0;
    padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    position: sticky; top: 0; z-index: 5; background: rgba(15,17,21,.92);
    backdrop-filter: saturate(140%) blur(8px);
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  header .titles { flex: 1; min-width: 0; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header .sub {
    color: var(--muted); font-size: 12px; margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  header button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    width: 38px; height: 38px; flex: none; display: grid; place-items: center;
  }
  header button:active { border-color: var(--accent); color: var(--accent); }
  header button.busy svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  main { max-width: 620px; margin: 0 auto; padding: 14px 16px 44px; }
  .empty { color: var(--muted); text-align: center; padding: 56px 16px; font-size: 14px; }
  .tally { display: flex; gap: 8px; margin-bottom: 14px; }
  .tally div {
    flex: 1 1 0; min-width: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; text-align: center;
  }
  .tally b { display: block; font-size: 19px; font-weight: 650; line-height: 1.2; }
  .tally span { color: var(--muted); font-size: 11px; }
  .tally .t-ok b { color: var(--ok); }
  .tally .t-warn b { color: var(--warn); }
  .tally .t-err b { color: var(--err); }
  .headline {
    background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
    padding: 13px 14px; margin-bottom: 18px;
  }
  .kicker {
    color: var(--muted); font-size: 10.5px; text-transform: uppercase;
    letter-spacing: .5px; font-weight: 600;
  }
  .headline .name {
    font-size: 15px; font-weight: 650; margin-top: 5px; overflow-wrap: anywhere;
  }
  .headline .detail { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .bar {
    height: 5px; border-radius: 3px; background: #0b0d12;
    overflow: hidden; margin-top: 8px;
  }
  .bar > i {
    display: block; height: 100%; border-radius: 3px; background: var(--ok);
    transition: width .3s ease;
  }
  .bar.warn > i { background: var(--warn); }
  .bar.err > i { background: var(--err); }
  .group-label {
    color: var(--muted); font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px;
    font-weight: 600; margin: 16px 2px 8px; display: flex; justify-content: space-between;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 13px; margin-bottom: 8px;
  }
  .card.dead { border-color: #3a2a27; }
  .row1 { display: flex; align-items: center; gap: 10px; }
  .badge {
    width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center;
    background: #10131a; border: 1px solid var(--line); font-weight: 700;
    text-transform: uppercase; font-size: 10.5px; color: var(--muted); flex: none;
  }
  .meta { flex: 1; min-width: 0; }
  .meta .name {
    font-weight: 600; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .meta .line2 {
    color: var(--muted); font-size: 12px; margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pill {
    font-size: 10.5px; padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); flex: none; white-space: nowrap; color: var(--muted);
  }
  .pill.ok { color: var(--ok); border-color: #24503b; }
  .pill.warn { color: var(--warn); border-color: #4d431f; }
  .pill.err { color: var(--err); border-color: #4d2b24; }
  .note {
    margin-top: 9px; font-size: 12px; color: var(--err);
    background: #1b1414; border: 1px solid #3a2a27; border-radius: 6px;
    padding: 7px 9px; overflow-wrap: anywhere;
  }
  .windows { margin-top: 11px; display: flex; flex-direction: column; gap: 9px; }
  .w-top {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 12px; color: var(--muted);
  }
  .w-top .w-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .w-top .w-val {
    flex: none; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums;
  }
  .w-reset { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .foot {
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted);
  }
  .gate {
    min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; gap: 12px; text-align: center;
  }
  .gate h1 { font-size: 17px; margin: 0; }
  .gate p { color: var(--muted); font-size: 13px; margin: 0 0 4px; max-width: 290px; }
  .gate input {
    font: 16px ui-monospace, SFMono-Regular, monospace; background: var(--panel);
    color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; width: min(280px, 80vw); text-align: center;
  }
  .gate input:focus { outline: none; border-color: var(--accent); }
  .gate button {
    font: 600 15px/1 -apple-system, system-ui, sans-serif; color: #fff;
    background: var(--accent); border: none; border-radius: 8px;
    padding: 13px 22px; width: min(280px, 80vw);
  }
  .gate .err-text { color: var(--err); font-size: 12px; min-height: 16px; }
</style>
</head>
<body>
<div id="gate" class="gate" hidden>
  <h1>TokenBar</h1>
  <p>계정 상태를 보려면 접근 코드를 입력하세요.</p>
  <input id="gate-input" type="password" inputmode="text" autocapitalize="off"
         autocorrect="off" spellcheck="false" placeholder="access code">
  <button id="gate-submit">확인</button>
  <div class="err-text" id="gate-err"></div>
</div>
<div id="app" hidden>
  <header>
    <div class="titles">
      <h1>TokenBar</h1>
      <div class="sub" id="subline">불러오는 중…</div>
    </div>
    <button id="refresh" aria-label="새로고침" title="새로고침">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>
      </svg>
    </button>
  </header>
  <main id="main"><div class="empty">불러오는 중…</div></main>
</div>
<script>
const TOKEN_KEY = "tokenbar_view_token";
const PROVIDER_LABEL = {
  codex: "Codex", claude: "Claude", xai: "Grok",
  antigravity: "Antigravity", copilot: "Copilot", devin: "Devin",
};
const WINDOW_LABEL = {
  "5h": "5시간", weekly: "주간", model_weekly: "주간 (모델)",
  monthly: "월간", daily: "일간",
};
const SEV_RANK = { err: 0, warn: 1, ok: 2 };

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function pctClass(pct) {
  if (pct == null) return "ok";
  if (pct >= 95) return "err";
  if (pct >= 80) return "warn";
  return "ok";
}

// Mirrors how the menu bar reads account.state: auth first (an expired token
// makes quota meaningless), then explicit quota state, then raw window usage.
function accountSeverity(a) {
  const st = a.state || {};
  if (a.token_expired || st.auth === "token_expired" || a.status === "error") return "err";
  if (st.quota === "exhausted" || a.status === "rate_limited") return "err";
  if (st.quota === "warning") return "warn";
  if (st.usable === false) return "warn";
  const pcts = (a.windows || [])
    .map(function (w) { return w.used_pct_effective != null ? w.used_pct_effective : w.used_pct; })
    .filter(function (v) { return v != null; });
  if (pcts.some(function (v) { return v >= 95; })) return "err";
  if (pcts.some(function (v) { return v >= 80; })) return "warn";
  return "ok";
}

function statusText(a) {
  const st = a.state || {};
  if (a.token_expired || st.auth === "token_expired") return "토큰 만료";
  if (st.quota === "exhausted") return "소진";
  if (st.quota === "warning") return "임박";
  if (st.quota === "ok") return "정상";
  if (a.status === "error") return "오류";
  return a.status || "알 수 없음";
}

function timeAgo(iso) {
  const t = new Date(iso).getTime();
  if (!isFinite(t)) return "-";
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return s + "초 전";
  if (s < 3600) return Math.floor(s / 60) + "분 전";
  if (s < 86400) return Math.floor(s / 3600) + "시간 전";
  return Math.floor(s / 86400) + "일 전";
}

function untilText(epochSeconds) {
  if (!epochSeconds) return "";
  const s = (epochSeconds * 1000 - Date.now()) / 1000;
  if (s <= 0) return "리셋 대기 중";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "분 후 리셋";
  if (s < 86400) {
    const h = Math.floor(s / 3600);
    const m = Math.round((s - h * 3600) / 60);
    return m ? h + "시간 " + m + "분 후 리셋" : h + "시간 후 리셋";
  }
  const d = Math.floor(s / 86400);
  const h = Math.floor((s - d * 86400) / 3600);
  return h ? d + "일 " + h + "시간 후 리셋" : d + "일 후 리셋";
}

function windowName(w) {
  const base = WINDOW_LABEL[w.kind] || w.kind || "사용량";
  return w.label ? base + " · " + w.label : base;
}

function windowRow(w) {
  const pct = w.used_pct_effective != null ? w.used_pct_effective : w.used_pct;
  const width = Math.min(100, Math.max(0, pct == null ? 0 : pct));
  const reset = untilText(w.reset_at_epoch);
  const stale = w.stale ? " · 데이터 지연" : "";
  return '<div class="win-row">' +
      '<div class="w-top">' +
        '<span class="w-name">' + escapeHtml(windowName(w)) + "</span>" +
        '<span class="w-val">' + (pct == null ? "n/a" : Number(pct).toFixed(0) + "%") + "</span>" +
      "</div>" +
      '<div class="bar ' + pctClass(pct) + '"><i style="width:' + width + '%"></i></div>' +
      (reset || stale ? '<div class="w-reset">' + escapeHtml(reset + stale) + "</div>" : "") +
    "</div>";
}

function subscriptionText(a) {
  const st = a.state || {};
  if (a.plan) return a.plan;
  if (st.subscription && st.subscription !== "unknown") return st.subscription;
  return "";
}

function shortDate(iso) {
  const d = new Date(iso);
  if (!isFinite(d.getTime())) return String(iso);
  return (d.getMonth() + 1) + "/" + d.getDate();
}

function footItems(a) {
  const st = a.state || {};
  const out = [];
  if (st.sub_renews_at) out.push("갱신 " + shortDate(st.sub_renews_at));
  if (st.sub_expires_at) out.push("만료 " + shortDate(st.sub_expires_at));
  if (a.last_poll) out.push("폴링 " + a.last_poll);
  return out;
}

function accountCard(a) {
  const sev = accountSeverity(a);
  const name = a.label || a.email || ("#" + a.id);
  const sub = subscriptionText(a);
  const secondary = a.email && a.email !== name
    ? (sub ? a.email + " · " + sub : a.email)
    : sub;
  const windows = (a.windows || []).filter(function (w) {
    return w.used_pct_effective != null || w.used_pct != null;
  });
  const note = sev === "err" && a.status_message ? a.status_message : "";
  const foot = footItems(a);
  return '<div class="card' + (sev === "err" ? " dead" : "") + '">' +
      '<div class="row1">' +
        '<div class="badge">' + escapeHtml(String(a.provider || "?").slice(0, 3)) + "</div>" +
        '<div class="meta">' +
          '<div class="name">' + escapeHtml(name) + "</div>" +
          '<div class="line2">' + escapeHtml(secondary) + "</div>" +
        "</div>" +
        '<span class="pill ' + sev + '">' + escapeHtml(statusText(a)) + "</span>" +
      "</div>" +
      (note ? '<div class="note">' + escapeHtml(note) + "</div>" : "") +
      (windows.length ? '<div class="windows">' + windows.map(windowRow).join("") + "</div>" : "") +
      (foot.length
        ? '<div class="foot">' +
            foot.map(function (t) { return "<span>" + escapeHtml(t) + "</span>"; }).join("") +
          "</div>"
        : "") +
    "</div>";
}

function render(data) {
  const main = document.getElementById("main");
  const accounts = data.accounts || [];
  document.getElementById("subline").textContent =
    accounts.length + "개 계정 · 동기화 " + (data._synced_at ? timeAgo(data._synced_at) : "-");
  if (!accounts.length) {
    main.innerHTML = '<div class="empty">연결된 계정이 없습니다.</div>';
    return;
  }
  const sevOf = {};
  const counts = { ok: 0, warn: 0, err: 0 };
  accounts.forEach(function (a) {
    sevOf[a.id] = accountSeverity(a);
    counts[sevOf[a.id]]++;
  });
  let html =
    '<div class="tally">' +
      '<div class="t-ok"><b>' + counts.ok + "</b><span>정상</span></div>" +
      '<div class="t-warn"><b>' + counts.warn + "</b><span>주의</span></div>" +
      '<div class="t-err"><b>' + counts.err + "</b><span>문제</span></div>" +
    "</div>";
  const h = data.headline;
  if (h) {
    const width = Math.min(100, Math.max(0, h.used_pct || 0));
    html +=
      '<div class="headline">' +
        '<div class="kicker">가장 임박한 리셋</div>' +
        '<div class="name">' +
          escapeHtml(PROVIDER_LABEL[h.provider] || h.provider) +
          (h.email ? " · " + escapeHtml(h.email) : "") +
        "</div>" +
        '<div class="detail">' +
          escapeHtml(WINDOW_LABEL[h.kind] || h.kind || "") +
          (h.used_pct != null ? " · " + Number(h.used_pct).toFixed(0) + "% 사용" : "") +
          (h.reset_at_epoch ? " · " + escapeHtml(untilText(h.reset_at_epoch)) : "") +
        "</div>" +
        '<div class="bar ' + pctClass(h.used_pct) + '"><i style="width:' + width + '%"></i></div>' +
      "</div>";
  }
  const groups = {};
  accounts.forEach(function (a) {
    (groups[a.provider] = groups[a.provider] || []).push(a);
  });
  const worst = function (p) {
    return Math.min.apply(null, groups[p].map(function (a) { return SEV_RANK[sevOf[a.id]]; }));
  };
  Object.keys(groups)
    .sort(function (p1, p2) { return worst(p1) - worst(p2) || p1.localeCompare(p2); })
    .forEach(function (provider) {
      const list = groups[provider].slice().sort(function (a, b) {
        return SEV_RANK[sevOf[a.id]] - SEV_RANK[sevOf[b.id]];
      });
      html +=
        '<div class="group-label">' +
          "<span>" + escapeHtml(PROVIDER_LABEL[provider] || provider) + "</span>" +
          "<span>" + list.length + "</span>" +
        "</div>" + list.map(accountCard).join("");
    });
  main.innerHTML = html;
}

let currentToken = null;
let loading = false;

function showGate(err) {
  document.getElementById("app").hidden = true;
  document.getElementById("gate").hidden = false;
  document.getElementById("gate-err").textContent = err || "";
}

function showApp() {
  document.getElementById("gate").hidden = true;
  document.getElementById("app").hidden = false;
}

async function load() {
  if (loading || !currentToken) return;
  loading = true;
  const btn = document.getElementById("refresh");
  btn.classList.add("busy");
  try {
    const r = await fetch("/api/status", {
      headers: { Authorization: "Bearer " + currentToken },
      cache: "no-store",
    });
    if (r.status === 401) {
      localStorage.removeItem(TOKEN_KEY);
      currentToken = null;
      showGate("접근 코드가 올바르지 않습니다.");
      return;
    }
    if (r.status === 404) {
      document.getElementById("main").innerHTML =
        '<div class="empty">아직 동기화된 데이터가 없습니다.<br>맥에서 상태를 푸시하면 표시됩니다.</div>';
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const record = await r.json();
    const payload = record.payload || record;
    payload._synced_at = record.received_at || payload.generated_at;
    render(payload);
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="empty">불러오지 못했습니다: ' + escapeHtml(e.message) + "</div>";
  } finally {
    loading = false;
    btn.classList.remove("busy");
  }
}

function submitToken() {
  const v = document.getElementById("gate-input").value.trim();
  if (!v) return;
  localStorage.setItem(TOKEN_KEY, v);
  currentToken = v;
  showApp();
  load();
}

document.getElementById("gate-submit").addEventListener("click", submitToken);
document.getElementById("gate-input").addEventListener("keydown", function (e) {
  if (e.key === "Enter") submitToken();
});
document.getElementById("refresh").addEventListener("click", load);

(function init() {
  const fromUrl = new URLSearchParams(location.search).get("t");
  if (fromUrl) {
    localStorage.setItem(TOKEN_KEY, fromUrl);
    history.replaceState(null, "", location.pathname);
  }
  currentToken = localStorage.getItem(TOKEN_KEY);
  if (!currentToken) {
    showGate("");
    return;
  }
  showApp();
  load();
  setInterval(function () { if (!document.hidden) load(); }, 30000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) load();
  });
})();
</script>
</body>
</html>
